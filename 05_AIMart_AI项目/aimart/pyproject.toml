[project]
name = "aimart"
version = "1.0.0"
description = "AI Marketplace Platform - browse, purchase and use AI capabilities (models, skills, experts, compute)"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=42.0",
    "structlog>=24.1",
    "redis>=5.0",
    "kafka-python>=2.0",
    "clickhouse-driver>=0.2",
    "elasticsearch[async]>=8.13",
    "httpx>=0.27",
    "minio>=7.2",
    "web3>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disable_error_code = ["type-arg", "attr-defined", "no-untyped-def"]

# Third-party packages without stubs
[[tool.mypy.overrides]]
module = [
    "kafka.*",
    "clickhouse_driver.*",
    "minio.*",
    "web3.*",
    "pyotp",
    "passlib.*",
    "argon2.*",
]
ignore_missing_imports = true

# Protocol & integration modules (lightweight type coverage acceptable)
[[tool.mypy.overrides]]
module = [
    "aimart.protocols.*",
    "aimart.integrations.*",
]
check_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["untyped-decorator", "no-untyped-call", "attr-defined"]

# Identity auth module (known type constraints)
[[tool.mypy.overrides]]
module = "aimart.domains.identity.auth"
ignore_missing_imports = true
disallow_untyped_defs = false

# Search indexer (legacy code)
[[tool.mypy.overrides]]
module = "aimart.domains.search.indexer"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
